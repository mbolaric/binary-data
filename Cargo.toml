[package]
name = "binary-data"
version = "0.1.0"
authors = ["Milan Bolaric"]
edition = "2021"

keywords = ["binary", "data", "file", "read"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = 'abort'

[dependencies]
log = { version = "0.4.17", features = ["max_level_debug", "release_max_level_warn"], optional = true }

[dev-dependencies]
log4rs = "1.4.0"
clap = { version = "4.6.3", features = ["derive"] }

[features]
default = []
logging = ["dep:log"]
