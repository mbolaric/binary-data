[package]
name = "binary-data"
version = "0.2.2"
authors = ["Milan Bolaric"]
edition = "2021"
readme = "README.md"
license = "MIT"
repository = "https://github.com/mbolaric/binary-data"
description = "A fast and flexible Rust crate for reading and writing binary data from files or memory."
keywords = ["binary", "data", "file", "read", "write"]
categories = ["encoding", "parsing"]
include = [
    "/src/**/*",
    "/examples/**/*.rs",
    "/tests/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = 'abort'

[dependencies]
log = { version = "0.4.17", features = ["max_level_debug", "release_max_level_warn"], optional = true }

[dev-dependencies]
log4rs = { version = "1.4.0", default-features = false, features = ["console_appender"] }
clap = { version = "4.6.3", features = ["derive"] }

[features]
default = []
logging = ["dep:log"]
